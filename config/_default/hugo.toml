baseURL = "https://forum.slothmud.net/"    # Update per site (e.g. https://forum.slothmud.net/)
title = "SlothMUD"                       # Site title
languageCode = "en-us"

# Declare the layered theme hierarchy (slothmud-theme overrides blowfish)
theme = ["slothmud-theme", "blowfish"]

[markup.goldmark.renderer]
unsafe = true

[build]
  [build.cleanDestinationDir]
    enable = true